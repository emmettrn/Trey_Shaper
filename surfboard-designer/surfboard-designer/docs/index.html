<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surfboard Designer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 16%22%3E%3Cpath d=%22M2 8C8 1 30 1 38 8 30 15 8 15 2 8Z%22 fill=%22%233cc8b4%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 40 16" class="logo" aria-hidden="true"><path d="M2 8 C 8 1, 30 1, 38 8 C 30 15, 8 15, 2 8 Z" /><line x1="4" y1="8" x2="36" y2="8" /></svg>
      <span>Surfboard Designer</span>
    </div>
    <div class="top-actions">
      <label class="preset">
        <span>Preset</span>
        <select id="preset"></select>
      </label>
      <button id="btn-feedback" class="ghost accent">Feedback</button>
      <button id="btn-save" class="ghost">Save design</button>
      <label class="ghost file-btn">Load<input id="file-load" type="file" accept=".json,application/json" hidden /></label>
      <div class="menu">
        <button id="btn-export" class="primary">Export ▾</button>
        <div class="menu-list" id="export-menu" hidden>
          <button data-fmt="stl" data-units="mm">STL (mm)</button>
          <button data-fmt="stl" data-units="in">STL (inches)</button>
          <button data-fmt="obj" data-units="mm">OBJ (mm)</button>
          <button data-fmt="txt" data-units="in">Spec sheet (.txt)</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="controls"></aside>

    <section class="stage">
      <div class="viewport" id="viewport">
        <div class="stats" id="stats">
          <div class="vol"><span id="s-vol">--</span><small>L</small></div>
          <div class="dims" id="s-dims">--</div>
          <div class="sub" id="s-sub"></div>
          <div class="warnings" id="warnings"></div>
        </div>
        <div class="viewbar">
          <div class="seg" id="views">
            <button data-view="threeq" class="on">3/4</button>
            <button data-view="deck">Deck</button>
            <button data-view="bottom">Bottom</button>
            <button data-view="side">Side</button>
            <button data-view="tail">Tail</button>
          </div>
          <div class="seg">
            <button id="t-wire">Wire</button>
            <button id="t-stringer" class="on">Stringer</button>
          </div>
        </div>
        <div class="hint" id="hint">Drag to rotate · scroll or pinch to zoom · pick a preset or type your own measurements on the left</div>
        <div class="busy" id="busy"></div>
      </div>

      <div class="panels">
        <figure class="panel"><figcaption>Plan <span>outline</span></figcaption><canvas id="c-plan"></canvas></figure>
        <figure class="panel"><figcaption>Profile <span>rocker &amp; foil, vertical ×3</span></figcaption><canvas id="c-rocker"></canvas></figure>
        <figure class="panel"><figcaption>Sections <span>vertical ×2</span>
          <em><i class="key k1"></i> tail 12″ <i class="key k2"></i> center <i class="key k3"></i> nose 12″</em></figcaption><canvas id="c-sections"></canvas></figure>
      </div>
    </section>
  </main>

  <div class="modal" id="feedback" hidden>
    <form class="sheet" id="feedback-form">
      <h2>Feedback</h2>
      <p>Thanks for trying it. Write whatever comes to mind, then copy it and send it to whoever shared this link with you.</p>
      <label>What were you trying to design?<textarea name="tried" rows="2" placeholder="e.g. a 5'10&quot; fish for small summer surf"></textarea></label>
      <label>What worked well?<textarea name="worked" rows="2"></textarea></label>
      <label>What was confusing, wrong, or looked off?<textarea name="confusing" rows="3"></textarea></label>
      <label>What would you want it to do next?<textarea name="wanted" rows="2" placeholder="fins, more tail shapes, comparing two boards, ..."></textarea></label>
      <label class="toggle"><input type="checkbox" name="design" checked /><span>Include the board I have open</span></label>
      <div class="sheet-actions">
        <button type="button" id="fb-cancel" class="ghost">Close</button>
        <button type="button" id="fb-save" class="ghost">Save as file</button>
        <button type="submit" class="primary">Copy feedback</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
