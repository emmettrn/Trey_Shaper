<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Surfboard Designer</title>
  <meta name="theme-color" content="#141b21" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Board Designer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 16%22%3E%3Cpath d=%22M2 8C8 1 30 1 38 8 30 15 8 15 2 8Z%22 fill=%22%233cc8b4%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #0e1317;
  --panel: #141b21;
  --panel-2: #19222a;
  --line: #24313b;
  --text: #dde6eb;
  --muted: #84949f;
  --accent: #3cc8b4;
  --accent-dim: #1f5f57;
  --warm: #ff8a5b;
  --sand: #e8c872;
  --foam: #f3efe6;
  --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans);
  overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
:root { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --bar: calc(52px + var(--safe-t)); }
button, canvas, summary, .seg, .tools { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
button, select, input { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.topbar {
  height: var(--bar); display: flex; align-items: center; justify-content: space-between;
  padding: var(--safe-t) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l)); border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; }
.logo { width: 34px; height: 14px; fill: var(--foam); stroke: none; }
.logo line { stroke: #9a7650; stroke-width: 1; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.preset { display: flex; align-items: center; gap: 8px; color: var(--muted); }
select {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
button, .file-btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
button:hover, .file-btn:hover { border-color: #3a4a56; }
.primary { background: var(--accent); color: #062420; border-color: var(--accent); font-weight: 600; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: transparent; }
.menu { position: relative; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 150px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: transparent; }
.menu-list button:hover { background: #22303a; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: calc(344px + var(--safe-l)) 1fr; height: calc(100% - var(--bar)); }
.sidebar { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 0 0 calc(24px + var(--safe-b)) var(--safe-l);
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.stage { display: grid; grid-template-rows: 1fr 236px; min-width: 0; min-height: 0; }

/* ---------- controls ---------- */
.group { border-bottom: 1px solid var(--line); }
.group > summary {
  list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between;
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary::after { content: "+"; font-family: var(--mono); }
.group[open] > summary::after { content: "–"; }
.group[open] > summary { color: var(--text); }
.fields { padding: 0 16px 12px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field.hidden { display: none; }
.field .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field label { color: #b9c6ce; }
.field .help { color: var(--muted); font-size: 11px; }
.field .val {
  width: 92px; text-align: right; background: transparent; border: 1px solid transparent; border-radius: 4px;
  font-family: var(--mono); font-size: 12px; padding: 2px 4px; color: var(--text);
}
.field .val:hover, .field .val:focus { border-color: var(--line); background: var(--panel-2); outline: none; }
.field.auto .val { color: var(--accent); }
.field .note { font-size: 11px; color: var(--accent); font-family: var(--mono); }
.field select { width: 100%; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--pct, 50%), var(--line) var(--pct, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--foam); border: 2px solid var(--accent); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--foam); border: 2px solid var(--accent); }
input[type=range]:disabled { opacity: .35; }

/* ---------- measurement table ---------- */
.stations { width: 100%; border-collapse: collapse; table-layout: fixed; }
.stations thead th { font-weight: 500; color: var(--muted); font-size: 11px; text-align: right; padding: 0 6px 4px 0; }
.stations thead th:first-child, .stations tbody th { width: 98px; }
.stations tbody th { text-align: left; font-weight: 400; color: #b9c6ce; white-space: nowrap; }
.stations td { padding: 2px 0 2px 5px; }
.cell {
  width: 100%; text-align: right; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; padding: 4px 5px;
}
.cell:hover { border-color: #3a4a56; }
.cell:focus { outline: none; border-color: var(--accent); }
.stations .fixed { display: block; text-align: right; color: var(--muted); font-size: 11px; line-height: 1.15; padding-right: 6px; }
.stations .fixed[hidden] { display: none; }

/* ---------- viewport ---------- */
.viewport { position: relative; min-height: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 35%, #1d2830 0%, #10161b 70%); }
.viewport canvas { display: block; }
.warnings { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.warnings span { background: #3b2a12; color: #ffc46b; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
.viewbar { position: absolute; right: 14px; top: 14px; display: flex; gap: 8px; }
.seg { display: flex; background: rgba(14,19,23,.72); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; color: var(--muted); border-radius: 6px; }
.seg button.on { background: var(--accent-dim); color: var(--text); }
.busy { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .2s; }
.busy.on { transform: scaleX(.7); transition: transform 1.5s ease-out; }


/* ---------- readout (top bar) ---------- */
.readout { display: flex; align-items: baseline; gap: 6px; margin: 0 auto 0 22px; font-family: var(--mono); white-space: nowrap; cursor: default; }
.readout b { font-size: 19px; font-weight: 500; }
.readout small { color: var(--muted); margin-right: 10px; }
.readout span { color: #b9c6ce; font-size: 13px; }
.viewport > .warnings { position: absolute; left: 14px; top: 14px; max-width: 46%; pointer-events: none; margin: 0; }
.viewport.bay { background: radial-gradient(ellipse at 50% 40%, #12171b 0%, #06080a 75%); }

/* ---------- 2D panels ---------- */
.panels { display: grid; grid-template-columns: 1.25fr 1.25fr 1fr; border-top: 1px solid var(--line); background: var(--panel); min-height: 0;
  padding: 0 var(--safe-r) var(--safe-b) 0; }
.panel { margin: 0; padding: 6px 10px 8px; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.panel:last-child { border-right: 0; }
.panel figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 26px; font-size: 11px; min-width: 0; }
.panel figcaption b { letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.panel figcaption > span:not(.tools) { color: var(--muted); white-space: nowrap; overflow: hidden; }
.panel canvas { width: 100%; height: 100%; min-height: 0; touch-action: none; }
.tools { margin-left: auto; display: flex; gap: 4px; flex: none; }
.tools button, .slicebar button {
  padding: 2px 7px; font-size: 11px; border-radius: 5px; background: transparent; color: var(--muted); border-color: var(--line); white-space: nowrap;
}
.tools button:hover, .slicebar button:hover { color: var(--text); border-color: #3a4a56; }
.tools button.on { color: var(--sand); border-color: #6b5a2a; }
.tools button[hidden] { display: none; }
.slicebar { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; order: 5; flex: 1 0 100%; padding-bottom: 2px; }
.slicebar button.on { background: #3a2f55; color: #e6dcff; border-color: #6a55a0; }
.slicebar button[data-add] { color: #b48cff; border-style: dashed; }

/* expand one view to fill the stage */
.stage[data-focus="view"] { grid-template-rows: 1fr; }
.stage[data-focus="view"] .panels { display: none; }
.stage[data-focus="plan"], .stage[data-focus="profile"], .stage[data-focus="sections"] { grid-template-rows: 1fr; }
.stage[data-focus="plan"] .viewport, .stage[data-focus="profile"] .viewport, .stage[data-focus="sections"] .viewport { display: none; }
.stage[data-focus="plan"] .panels, .stage[data-focus="profile"] .panels, .stage[data-focus="sections"] .panels { grid-template-columns: 1fr; border-top: 0; }
.stage[data-focus="plan"] .panel:not([data-panel="plan"]),
.stage[data-focus="profile"] .panel:not([data-panel="profile"]),
.stage[data-focus="sections"] .panel:not([data-panel="sections"]) { display: none; }
.stage[data-focus="plan"] .panel, .stage[data-focus="profile"] .panel, .stage[data-focus="sections"] .panel { padding: 10px 16px 14px; }

/* ---------- cross-section sliders ---------- */
.section-group { background: rgba(180,140,255,.05); box-shadow: inset 3px 0 0 #6a55a0; }
.section-group[hidden] { display: none; }
.section-group > summary { color: #cdb9ff !important; }
.section-group input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(to right, #b48cff var(--pct, 50%), var(--line) var(--pct, 50%)); }
.section-group input[type=range]::-webkit-slider-thumb { border-color: #b48cff; }
.section-group input[type=range]::-moz-range-progress { background: #b48cff; }
.section-group input[type=range]::-moz-range-thumb { border-color: #b48cff; }

/* ---------- measurement extras ---------- */
.wp-row { display: flex; align-items: center; gap: 8px; color: #b9c6ce; }
.wp-row > span:first-child { width: 98px; flex: none; }
.wp-row .cell { width: 66px; flex: none; }
.wp-row .unit { color: var(--muted); font-size: 11px; }
.toggle.fix small { display: block; color: var(--muted); font-size: 11px; }
.cell::placeholder { color: var(--accent); opacity: .75; font-style: italic; }
.field.is-auto .val { color: var(--accent); font-style: italic; }

/* ---------- feedback, toast, hint ---------- */
.accent { color: var(--accent); border-color: var(--accent-dim); }
.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); pointer-events: none;
  background: rgba(14,19,23,.72); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px;
  color: var(--muted); font-size: 12px; white-space: nowrap; transition: opacity .6s;
}
.hint.gone { opacity: 0; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,8,10,.6); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }
.sheet {
  width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.sheet h2 { margin: 0; font-size: 17px; }
.sheet p { margin: 0; color: var(--muted); }
.sheet label { display: grid; gap: 5px; color: #b9c6ce; }
.sheet textarea {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; resize: vertical;
}
.sheet textarea:focus { outline: none; border-color: var(--accent); }
.sheet .toggle { display: flex; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
  background: #22303a; border: 1px solid #3a4a56; border-radius: 8px; padding: 9px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.toast[hidden] { display: none; }

/* ---------- phones and narrow windows ---------- */
/* ---------- install tip (iPhone / iPad Safari) ---------- */
.install {
  position: fixed; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translateX(-50%); z-index: 55; width: min(440px, calc(100% - 24px));
  display: flex; align-items: center; gap: 12px; background: #1d2a33; border: 1px solid var(--accent-dim); border-radius: 12px;
  padding: 10px 12px 10px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
}
.install[hidden] { display: none; }
.install span { flex: 1; }
.install button { flex: none; }

/* ---------- fingers instead of a mouse ---------- */
@media (pointer: coarse) {
  button, .file-btn, select { min-height: 36px; }
  .tools button, .slicebar button { min-height: 30px; padding: 3px 10px; font-size: 12px; }
  .tools button[data-act="in"] { display: none; }      /* pinch instead */
  .seg button { min-height: 34px; padding: 5px 11px; }
  .cell { padding: 7px 5px; }
  .field .val { padding: 6px 4px; }
  input[type=range] { height: 30px; }
  input[type=range]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -10.5px; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; }
  .toggle input { width: 22px; height: 22px; }
  .group > summary { padding: 15px 16px; }
  .stage { grid-template-rows: 1fr 264px; }
}

@media (max-width: 820px) {
  html, body { height: auto; overflow: visible; overflow-x: hidden; }
  .panel canvas { touch-action: pan-x pan-y; }
  .stage[data-focus]:not([data-focus=""]) .panel canvas { touch-action: none; }
  .sidebar { padding-left: 0; }
  .topbar { height: auto; flex-wrap: wrap; gap: 8px; padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l)); }
  .brand span { font-size: 14px; }
  .top-actions { flex-wrap: wrap; gap: 6px; width: 100%; }
  .preset > span { display: none; }
  .preset select { max-width: 52vw; }
  .layout { display: flex; flex-direction: column; height: auto; }
  .stage { order: -1; height: 80vh; grid-template-rows: 1fr 200px; }
  .sidebar { border-right: 0; overflow: visible; }
  .panels { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 82%; overflow-x: auto; scroll-snap-type: x mandatory; }
  .panel { scroll-snap-align: start; }
  .viewbar { top: auto; bottom: 8px; right: 8px; left: 8px; justify-content: space-between; flex-wrap: wrap; }
  .readout { margin: 0; order: 3; }
  .tools button[data-act="in"] { display: none; }
  .seg button { padding: 5px 7px; }
  .hint { display: none; }
}

/* ---------- undo / redo ---------- */
.undo { display: flex; gap: 4px; }
.undo button { padding: 4px 9px; font-size: 16px; line-height: 1; }
button:disabled { opacity: .35; cursor: default; }

/* ---------- edit / view, section scroller ---------- */
.tools button[data-act="edit"].on { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }
.slicebar { align-items: center; }
.slicebar input[type=range] { flex: 1 1 110px; min-width: 90px; }
.slicebar input[type=range]::-webkit-slider-runnable-track { background: var(--line); }
.slicebar .where { font-family: var(--mono); color: var(--text); white-space: nowrap; flex: none; }
.slicebar .editing { color: #e6dcff; white-space: nowrap; flex: none; }
.slicebar button { flex: none; }
.slicebar button[data-edit] { color: #cdb9ff; border-color: #6a55a0; }
.slicebar button[data-done] { background: var(--accent); color: #062420; border-color: var(--accent); font-weight: 600; }

/* ---------- bottom contour stations ---------- */
.bottom-box { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.bottom-head { color: #b9c6ce; }
.bottom-rows { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: 58px auto 1fr 26px; gap: 5px 6px; align-items: center;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.brow .cell { background: var(--panel); }
.brow span { color: var(--muted); font-size: 11px; white-space: nowrap; }
.brow select { padding: 4px 6px; min-width: 0; width: 100%; }
.brow .x { padding: 0; width: 26px; height: 26px; color: var(--muted); background: transparent; }
.brow .line2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 62px 62px; gap: 6px; align-items: center; }
.brow .line2.one { grid-template-columns: 1fr 62px; }
.brow .line2.none { grid-template-columns: 1fr; }
.bottom-actions { display: flex; gap: 6px; }
.bottom-actions button { padding: 4px 10px; font-size: 12px; }

@media (max-width: 1320px) { .preset > span { display: none; } .brand span { display: none; } }

/* ---------- added measurements ---------- */
.marks-box { display: grid; gap: 5px; }
.mrow { display: grid; grid-template-columns: 44px 58px 1fr 1fr 1fr 22px; gap: 4px; align-items: center; }
.mrow.mhead span { color: var(--muted); font-size: 11px; text-align: right; padding-right: 6px; }
.mrow.mhead span:nth-child(-n+2) { text-align: left; padding: 0 0 0 2px; }
.marks-rows { display: grid; gap: 4px; }
.mrow select { padding: 3px 2px; min-width: 0; width: 100%; font-size: 12px; }
.mrow .cell { min-width: 0; width: 100%; }
.mrow .cell::placeholder { color: var(--muted); opacity: .75; }
.mrow .x { padding: 0; width: 22px; height: 24px; color: var(--muted); background: transparent; border-color: transparent; }
.mrow.off { opacity: .45; }
/* ---------- bay light strength ---------- */
#bay-gain { width: 64px; margin: 0 6px 0 2px; align-self: center; }
#bay-gain[hidden] { display: none; }
.mrow[hidden] { display: none; }
#t-fixed[hidden] { display: none; }

</style>

<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 40 16" class="logo" aria-hidden="true"><path d="M2 8 C 8 1, 30 1, 38 8 C 30 15, 8 15, 2 8 Z" /><line x1="4" y1="8" x2="36" y2="8" /></svg>
      <span>Surfboard Designer</span>
    </div>
    <div class="readout" id="stats"><b id="s-vol">--</b><small>L</small><span id="s-dims"></span></div>
    <div class="top-actions">
      <span class="undo">
        <button id="btn-undo" class="ghost" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
        <button id="btn-redo" class="ghost" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
      </span>
      <label class="preset">
        <span>Preset</span>
        <select id="preset"></select>
      </label>
      <button id="btn-feedback" class="ghost accent">Feedback</button>
      <button id="btn-save" class="ghost">Save</button>
      <label class="ghost file-btn">Load<input id="file-load" type="file" accept=".json,application/json" hidden /></label>
      <div class="menu">
        <button id="btn-export" class="primary">Export ▾</button>
        <div class="menu-list" id="export-menu" hidden>
          <button data-fmt="stl" data-units="mm">STL (mm)</button>
          <button data-fmt="stl" data-units="in">STL (inches)</button>
          <button data-fmt="obj" data-units="mm">OBJ (mm)</button>
          <button data-fmt="txt" data-units="in">Spec sheet (.txt)</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="controls"></aside>

    <section class="stage">
      <div class="viewport" id="viewport">
        <div class="warnings" id="warnings"></div>
        <div class="viewbar">
          <div class="seg" id="views">
            <button data-view="threeq" class="on">3/4</button>
            <button data-view="deck">Top</button>
            <button data-view="side">Side</button>

  const sL = (i) => own(knots[i][2]);
  const sR = (i) => (isCorner(i) ? own(knots[i][6]) : own(knots[i][2]));
  const h = (i) => xs[i + 1] - xs[i], d = (i) => (ys[i + 1] - ys[i]) / h(i);
  let a = 0;
  for (let b = 1; b < n; b++) {
    if (b !== n - 1 && !isCorner(b)) continue;
    const N = b - a + 1, lo = new Float64Array(N), di = new Float64Array(N), up = new Float64Array(N), rhs = new Float64Array(N);
    for (let r = 0; r < N; r++) {
      const i = a + r;
      let hold = null;                                              // a slope this knot is held at
      if (r === 0) hold = i === 0 ? (sL(0) ?? (fixStart ? 0 : null)) : sR(i);
      else if (r === N - 1) hold = i === n - 1 ? (sL(i) ?? (fixEnd ? 0 : null)) : sL(i);
      else hold = sL(i);
      if (hold !== null) { di[r] = 1; rhs[r] = hold; }
      else if (r === 0) { di[r] = 2; up[r] = 1; rhs[r] = 3 * d(i); }
      else if (r === N - 1) { lo[r] = 1; di[r] = 2; rhs[r] = 3 * d(i - 1); }
      else { lo[r] = h(i); di[r] = 2 * (h(i - 1) + h(i)); up[r] = h(i - 1); rhs[r] = 3 * (h(i) * d(i - 1) + h(i - 1) * d(i)); }
    }
    for (let r = 1; r < N; r++) { const w = lo[r] / di[r - 1]; di[r] -= w * up[r - 1]; rhs[r] -= w * rhs[r - 1]; }
    const m = new Float64Array(N);
    m[N - 1] = rhs[N - 1] / di[N - 1];
    for (let r = N - 2; r >= 0; r--) m[r] = (rhs[r] - up[r] * m[r + 1]) / di[r];
    for (let r = 0; r < N; r++) {
      const i = a + r;
      if (r === 0 && a > 0) mR[i] = m[r];                           // a corner: this run is on its right
      else if (r === N - 1 && b < n - 1) mL[i] = m[r];              // a corner: this run is on its left
      else mL[i] = mR[i] = m[r];
    }
    a = b;
  }
  return { mL, mR };
}

/**
 * A curve through knots [x, y, slope, armLeft, armRight, corner, slopeRight] (the last four
 * optional), as cubic Bezier segments. With the default arms (a third of the way to the
 * next knot) each segment is exactly the cubic of the fair spline in splineSlopes, which
 * is continuous in position, slope and curvature. Returns { at(xq), arms } where arms[i] =
 * the handle actually used at knot i ({ x, m, mR, corner, aL, aR }: m is the slope on the
 * left, mR on the right; they differ only at a corner).
 */
function knotCurve(knots, fixStart, fixEnd) {
  const n = knots.length, xs = knots.map((k) => k[0]), ys = knots.map((k) => k[1]);
  const { mL, mR } = splineSlopes(knots, fixStart, fixEnd);
  const A = new Float64Array(n), B = new Float64Array(n);       // right arm of knot i, left arm of knot i + 1
  for (let i = 0; i < n - 1; i++) {
    const h = xs[i + 1] - xs[i];
    let a = Number.isFinite(knots[i][4]) ? knots[i][4] : h / 3, b = Number.isFinite(knots[i + 1][3]) ? knots[i + 1][3] : h / 3;
    if (a + b > h) { const f = h / (a + b); a *= f; b *= f; }    // arms may not cross: keeps one height per position
    A[i] = a; B[i + 1] = b;
  }
  const at = (xq) => {
    let i = 0;
    while (i < n - 2 && xq > xs[i + 1]) i++;
    const X0 = xs[i], X3 = xs[i + 1], X1 = X0 + A[i], X2 = X3 - B[i + 1];
    const Y0 = ys[i], Y3 = ys[i + 1], Y1 = Y0 + A[i] * mR[i], Y2 = Y3 - B[i + 1] * mL[i + 1];
    let lo = 0, hi = 1;
    for (let it = 0; it < 48; it++) {
      const t = (lo + hi) / 2, u = 1 - t;
      if (u * u * u * X0 + 3 * u * u * t * X1 + 3 * u * t * t * X2 + t * t * t * X3 < xq) lo = t; else hi = t;
    }
    const t = (lo + hi) / 2, u = 1 - t;
    return u * u * u * Y0 + 3 * u * u * t * Y1 + 3 * u * t * t * Y2 + t * t * t * Y3;
  };
  return { at, arms: knots.map((k, i) => ({ x: xs[i], m: mL[i], mR: mR[i], corner: i > 0 && i < n - 1 && !!k[5], aL: B[i], aR: A[i] })) };
}

/**
 * Bottom contours along the board, from the stations the shaper entered (flat here, 1/16"
 * concave there, double concave further back, vee off the tail). Each station sets the
 * depth of three channels; between stations each channel is blended with a
 * shape-preserving cubic. The nose tip is flat and the last station runs out the tail.
 */
function cleanBottom(p) {
  const L = p.length, rows = [];
  for (const r of Array.isArray(p.bottom) ? p.bottom : []) {
    if (!r || !Number.isFinite(r.pos)) continue;
    const from = r.from === 'nose' ? 'nose' : 'tail';
    const type = Object.prototype.hasOwnProperty.call(BOTTOM_TYPES, r.type) ? r.type : 'flat';
    const depth = Number.isFinite(r.depth) ? clip(r.depth, 0, 0.75) : 0, depth2 = Number.isFinite(r.depth2) ? clip(r.depth2, 0, 0.75) : 0;
    const [c, d, v] = BOTTOM_TYPES[type](depth, depth2);
    rows.push({ pos: r.pos, from, type, depth, depth2, x: clip(from === 'nose' ? L - r.pos : r.pos, 0, L), c, d, v });
  }
  rows.sort((a, b) => a.x - b.x);
  const kept = [];
  for (const r of rows) {
    if (kept.length === 24) break;
    if (kept.length && r.x - kept[kept.length - 1].x < 0.5) continue;
    kept.push(r);
  }
  return kept;
}

function bottomCurves(p) {
  const rows = p.bottom;
  if (!rows.length) return null;
  const L = p.length, xs = [], C = [], D = [], V = [];
  const push = (x, c, d, v) => { xs.push(x); C.push(c); D.push(d); V.push(v); };
  if (rows[0].x > 0.5) push(0, rows[0].c, rows[0].d, rows[0].v);
  for (const r of rows) push(r.x, r.c, r.d, r.v);
  if (rows[rows.length - 1].x < L - 0.5) push(L, 0, 0, 0);
  if (xs.length < 2) push(L, C[0], D[0], V[0]);
  return { xs, C, D, V, mC: pchipSlopes(xs, C, true, true), mD: pchipSlopes(xs, D, true, true), mV: pchipSlopes(xs, V, true, true) };
}

/** [single concave (negative = roll), double concave, vee] depths at x, before any slice adjustment. */
function bottomAt(p, x) {
  const b = p._bottom;
  if (!b) return [concaveAt(p, x), 0, veeAt(p, x)];             // the simple Concave / Vee sliders
  const xq = clip(x, b.xs[0], b.xs[b.xs.length - 1]);
  return [hermiteAt(b.xs, b.C, b.mC, xq), hermiteAt(b.xs, b.D, b.mD, xq), hermiteAt(b.xs, b.V, b.mV, xq)];
}

/**
 * Correction for one design curve, evaluated at the stations x.
 * The measured points (the tips, the 12" stations and the curve's origin) are knots with
 * offset 0, so the measurements never change; the origin is also held level. Everything
 * else (anchors, added measurements) is a knot with its offset, and one fair curve is
 * drawn through all of them. Its position, slope and curvature are continuous through
 * every knot, so a new point never leaves a lump or a crease, and the curve is the base
 * curve again, exactly, wherever no point reaches. A point is only sharp where it has
 * been made a corner.
 */
function curveDelta(p, name, x, arms) {
  const out = new Float64Array(x.length);
  const L = p.length, pin = pinsFor(p, name), H = p.handles[name];
  // a measured point as a knot: offset 0, and the slope and arms of its handle if it has been given one
  const pinKnot = (xk, key) => { const hd = H[key]; return [xk, 0, key === 'origin' ? null : hd ? hd[0] : null, hd ? hd[1] : null, hd ? hd[2] : null]; };
  const all = [{ k: [0, 0], tag: 'tip' }, { k: [L, 0], tag: 'tip' }, { k: pinKnot(pin.origin, 'origin'), tag: 'origin' }];
  if (pin.tail12) all.push({ k: pinKnot(12, 'tail12'), tag: 'tail12' });
  if (pin.nose12) all.push({ k: pinKnot(L - 12, 'nose12'), tag: 'nose12' });
  for (const q of [...p.anchors[name], ...p._marks[name]]) all.push({ k: q, tag: null });
  all.sort((a, b) => a.k[0] - b.k[0]);
  const list = all.filter((e, i) => i === 0 || e.k[0] - all[i - 1].k[0] > 1e-6);
  const live = list.some(({ k }) => k[1] !== 0 || (Number.isFinite(k[2]) && k[2] !== 0));
  if (!live && !arms) return out;
  const curve = knotCurve(list.map((e) => e.k), false, false);
  // The origin (wide / low / thick point) must stay exactly level. Holding the spline to that
  // would put a step in its curvature there, so the spline runs free through the origin and
  // its slope s there is taken out again with s * lev(), a smooth local shape that is 0 at
  // the origin with slope 1, and 0 (slope and curvature too) from the neighbouring knots
  // outwards. The knots keep their values and slopes and the curve stays smooth.
  const oi = list.findIndex((e) => e.tag === 'origin'), o = pin.origin;
  let so = 0, R = 1;
  if (oi > 0 && oi < list.length - 1) { so = curve.arms[oi].m; R = Math.min(o - list[oi - 1].k[0], list[oi + 1].k[0] - o); }
  const lev = (t) => { const u = t / R, w = 1 - u * u; return Math.abs(u) >= 1 ? 0 : t * w * w * w; };
  if (live) for (let i = 0; i < x.length; i++) if (x[i] > 0 && x[i] < L) out[i] = curve.at(x[i]) - so * lev(x[i] - o);
  if (arms) {
    arms.pins = {};
    curve.arms.forEach((r, i) => {
      const tag = list[i].tag;
      if (tag === 'tip') return;
      if (tag) arms.pins[tag] = { x: r.x, m: tag === 'origin' ? 0 : r.m, aL: r.aL, aR: r.aR };
      else arms.push(r);
    });
  }
  return out;
}

/**
 * Cross-section slices. A slice can adjust the section's shape settings (deck dome, rail
 * fullness, rail apex, rail edge, concave, vee) and carry anchor points on its deck and
 * bottom lines: [rho, d] with rho the position along the line by arc length (0 at the
 * stringer, 1 at the rail apex, so the turn of the rail gets its fair share) and d how far
 * the surface moves along its own normal there, as a fraction of the local thickness
 * (deck: outward; bottom: up, which is inward at the rail). On the flat of the deck and
 * bottom that is straight up and down; on the rail it is in and out. Everything a slice
 * changes blends smoothly to nothing toward the neighbouring slices and the tips.
 */
function sliceTables(p) {
  const sl = p.slices;
  const pts = sl.some((s) => s.deck.length || s.bottom.length);
  if (!pts && !sl.some((s) => Object.values(s.adj).some((v) => v !== 0))) return null;
  const table = (list) => {
    const T = new Float64Array(GRID);
    T.arms = [];
    if (!list.length) return T;
    const curve = knotCurve([[0, 0], ...list, [1, 0]], true, false);   // level across the stringer
    for (let g = 0; g < GRID; g++) T[g] = curve.at(g / (GRID - 1));
    T[GRID - 1] = 0;
    T.arms = curve.arms.slice(1, -1);
    return T;
  };
  const zero = new Float64Array(GRID), adj = {};
  for (const k of Object.keys(ADJ)) adj[k] = [0, ...sl.map((s) => s.adj[k]), 0];
  return {
    pts, adj,
    kx: [0, ...sl.map((s) => s.x), p.length],
    deck: [zero, ...sl.map((s) => table(s.deck)), zero],
    bottom: [zero, ...sl.map((s) => table(s.bottom)), zero],
  };
}

/** What the slices change at position x: fills d (setting adjustments) and, if given, the offset rows. */
function sliceBlend(sl, x, d, rowD, rowB) {
  let j = 0;
  while (j < sl.kx.length - 2 && x >= sl.kx[j + 1]) j++;
  const tt = clip((x - sl.kx[j]) / (sl.kx[j + 1] - sl.kx[j]), 0, 1);
  const wq = tt * tt * tt * (tt * (6 * tt - 15) + 10);
  for (const k in sl.adj) d[k] = (1 - wq) * sl.adj[k][j] + wq * sl.adj[k][j + 1];
  if (sl.pts && rowD) for (let g = 0; g < GRID; g++) {
    rowD[g] = (1 - wq) * sl.deck[j][g] + wq * sl.deck[j + 1][g];
    rowB[g] = (1 - wq) * sl.bottom[j][g] + wq * sl.bottom[j + 1][g];
  }
}

/**
 * Section shape settings at x for local thickness t: the board-wide values plus a slice
 * adjustment d (or none). The rail apex is a height in inches above the flat bottom line
 * when rail_apex_in is set (older designs give it as a fraction of thickness instead).
 */
function sectionShape(p, x, d, t) {
  const g = (k) => (d ? d[k] : 0);
  const [c0, d0, v0] = bottomAt(p, x);
  let con = clip(c0 + g('concave'), -0.5, 0.75), dbl = clip(d0 + g('double'), 0, 0.75);
  const lift = Math.abs(con) + dbl, cap = 0.5 * t;                // never carve more than half the thickness
  if (lift > cap) { const f = cap / lift; con *= f; dbl *= f; }
  return {
    ar: p.rail_apex_in !== null ? apexRatio(p.rail_apex_in + g('rail_apex_in'), t) : clip(p.rail_apex + g('rail_apex'), 0.15, 0.6),
    ed: 1.7 + 1.4 * clip(p.rail_fullness + g('rail_fullness'), 0, 1),
    eb: 2 + 6 * clip(railHardness(p, x) + g('rail_hardness'), 0, 1),
    dome: clip(p.deck_dome + g('deck_dome'), 0, 1),
    con, dbl, vee: clip(v0 + g('vee'), 0, 0.75),
  };
}
/**
 * Rail apex height a (inches above the bottom line) as a fraction of the thickness t. It can
 * never pass 60% of the thickness; where the board thins out it eases into that limit
 * instead of hitting it, so the rail line has no corner along the board.
 */
function apexRatio(a, t) {
  const ts = Math.max(t, 1e-9), hi = 0.6 * ts, av = Math.max(a, 1e-3);
  return clip((av ** -6 + hi ** -6) ** (-1 / 6) / ts, 0.1, 0.6);
}
/** Board-wide section settings at x, in the same terms a slice adjusts (for the UI). */
function sectionBase(p, x) {
  const [c0, d0, v0] = bottomAt(p, x);
  return { rail_apex: p.rail_apex, rail_apex_in: p.rail_apex_in ?? 0, rail_fullness: p.rail_fullness, deck_dome: p.deck_dome,
    rail_hardness: railHardness(p, x), concave: c0, double: d0, vee: v0 };
}
const gridAt = (row, eta) => {
  const f = eta * (GRID - 1), i0 = Math.min(Math.floor(f), GRID - 2);
  return row[i0] + (f - i0) * (row[i0 + 1] - row[i0]);
};

/* ---------------------------------------------------------------------------
   1D profiles
   --------------------------------------------------------------------------- */
function closureExponent(r, b, uRef) {
  r = clip(r, 1e-3, 0.999);
  return Math.log(1 - r ** b) / Math.log(uRef);
}

function halfWidth(p, x) {
  const L = p.length, W2 = p.width / 2, xw = L / 2 + p.wide_point_offset;
  const bn = NOSE_TYPES[p.nose_type];
  const an = closureExponent(p.nose_width_12 / p.width, bn, (L - 12 - xw) / (L - xw));
  const tail = TAIL_TYPES[p.tail_type], bt = tail.b;
  const te = tail.closes ? 0 : p.tail_block_width / p.width;
  const at = closureExponent((p.tail_width_12 / p.width - te) / (1 - te), bt, (xw - 12) / xw);
  const rc = tail.corner;
  const h = new Float64Array(x.length);
  for (let i = 0; i < x.length; i++) {
    const xi = x[i];
    let v;
    if (xi >= xw) v = W2 * clip(1 - ((xi - xw) / (L - xw)) ** an, 0, 1) ** (1 / bn);
    else v = W2 * (te + (1 - te) * clip(1 - ((xw - xi) / xw) ** at, 0, 1) ** (1 / bt));
    if (rc > 0 && xi < rc) v = v - rc + Math.sqrt(Math.max(rc * rc - (rc - xi) ** 2, 0));
    h[i] = Math.max(v, 0);
  }
  return h;
}

function notchHalfWidth(p, x, arms) {
  const out = new Float64Array(x.length);
  if (!TAIL_TYPES[p.tail_type].notch) return out;
  const D = p.swallow_depth, pts = p.anchors.swallow;
  const curve = pts.length ? knotCurve([[0, 0, null, null, null], ...pts, [D, 0, null, null, null]], false, false) : null;
  for (let i = 0; i < x.length; i++) {
    const base = Math.max((p.swallow_width / 2) * (1 - x[i] / D), 0);
    out[i] = curve && x[i] > 0 && x[i] < D ? Math.max(base + curve.at(x[i]), 0.1 * base) : base;   // the cut never closes early
  }
  if (arms && curve) arms.push(...curve.arms.slice(1, -1));
  return out;
}

function rockerExponents(p) {
  const xl = p.length / 2 + p.rocker_low_point;
  return [[p.nose_rocker, p.nose_rocker_12, true], [p.tail_rocker, p.tail_rocker_12, false]].map(([R, r12, nose]) => {
    let k = 2;
    if (R > 1e-9) k = r12 <= 0 ? K_MAX : Math.log(r12 / R) / Math.log(u12(p.length, xl, nose));
    return clip(k, K_MIN, K_MAX);
  });
}

function foilExponents(p) {
  const xt = p.length / 2 + p.thickness_point_offset;
  return [[p.nose_thickness, p.nose_thickness_12, true], [p.tail_thickness, p.tail_thickness_12, false]].map(([te, t12, nose]) => {
    let e = 2;
    if (p.thickness - te > 1e-9) {
      const drop = 1 - (t12 - te) / (p.thickness - te);
      e = drop <= 0 ? P_MAX : drop >= 1 ? P_MIN : Math.log(drop) / Math.log(u12(p.length, xt, nose));
    }
    return clip(e, P_MIN, P_MAX);
  });
}

function rocker(p, x) {
  const L = p.length, xl = L / 2 + p.rocker_low_point;
  const [kn, kt] = rockerExponents(p);
  return Float64Array.from(x, (xi) => (xi >= xl
    ? p.nose_rocker * clip((xi - xl) / (L - xl), 0, 1) ** kn
    : p.tail_rocker * clip((xl - xi) / xl, 0, 1) ** kt));
}

function foil(p, x) {
  const L = p.length, xt = L / 2 + p.thickness_point_offset;
  const [en, et] = foilExponents(p);
  return Float64Array.from(x, (xi) => {
    const nose = xi >= xt;
    const u = nose ? (xi - xt) / (L - xt) : (xt - xi) / xt;
    const tEnd = nose ? p.nose_thickness : p.tail_thickness;
    return tEnd + (p.thickness - tEnd) * (1 - clip(u, 0, 1) ** (nose ? en : et));
  });
}

const railHardness = (p, x) =>
  p.rail_hardness_tail + (p.rail_hardness_nose - p.rail_hardness_tail) * smoothstep((x - 0.15 * p.length) / (0.6 * p.length));
const concaveAt = (p, x) => p.concave_depth * smoothstep((0.8 * p.length - x) / (0.25 * p.length)) * smoothstep(x / 3);
const veeAt = (p, x) => p.vee_depth * smoothstep((0.35 * p.length - x) / (0.3 * p.length));

/* ---------------------------------------------------------------------------
   Cross sections: right half, deck centerline -> rail -> bottom centerline
   --------------------------------------------------------------------------- */
const K = 900;
const TH_COS = new Float64Array(K), TH_SIN = new Float64Array(K), TH_DECK = new Uint8Array(K);
for (let k = 0; k < K; k++) {
  const th = k === K - 1 ? -Math.PI / 2 : Math.PI / 2 + k * (-Math.PI / (K - 1));
  TH_COS[k] = Math.abs(Math.cos(th)); TH_SIN[k] = Math.abs(Math.sin(th)); TH_DECK[k] = th >= 0 ? 1 : 0;
}

const KA = K / 2;                                        // deck = samples 0 .. KA-1 (stringer -> rail apex), bottom = KA .. K-1 (apex -> stringer)
const S_RHO = new Float64Array(K), S_NY = new Float64Array(K), S_NZ = new Float64Array(K);
const ZERO_ROW = new Float64Array(GRID);

/**
 * One cross section, densely sampled, into Y / Z. With offset rows (a slice's anchor
 * points, blended to this position) every point is moved along the normal of the section
 * there by thickness x row(rho), rho = its arc-length position between the stringer (0)
 * and the rail apex (1). aux, if given, also receives the section before the anchor
 * points (Y0, Z0), rho, the normals and the two arc lengths.
 */
function sectionDense(p, xi, hi, yi, ti, zbi, d, rowD, rowB, Y, Z, aux) {
  const sh = sectionShape(p, xi, d, ti);
  const { ar, ed, eb, dome, con, dbl, vee } = sh;
  const zApex = zbi + ar * ti, td = (1 - ar) * ti, tb = ar * ti;
  const hs = Math.max(hi, 1e-9);
  for (let k = 0; k < K; k++) {
    const deck = TH_DECK[k], e = deck ? ed : eb;
    const yraw = hi * TH_COS[k] ** (2 / e);
    const eta = clip(yraw / hs, 0, 1);
    Z[k] = deck
      ? zApex + td * TH_SIN[k] ** (2 / ed) * (1 - 0.7 * dome * eta * eta)
      : zApex - tb * TH_SIN[k] ** (2 / e) + con * (1 - eta * eta) ** 2 + (dbl * eta ** 1.5 * (1 - eta) ** 2) / K2 - vee * (1 - eta);
    Y[k] = yi + (yraw * (hi - yi)) / hs;
  }
  if (!rowD) return sh;
  const RHO = aux ? aux.rho : S_RHO, NY = aux ? aux.ny : S_NY, NZ = aux ? aux.nz : S_NZ;
  RHO[0] = 0;
  for (let k = 1; k < KA; k++) RHO[k] = RHO[k - 1] + Math.hypot(Y[k] - Y[k - 1], Z[k] - Z[k - 1]);
  RHO[K - 1] = 0;
  for (let k = K - 2; k >= KA; k--) RHO[k] = RHO[k + 1] + Math.hypot(Y[k] - Y[k + 1], Z[k] - Z[k + 1]);
  const aD = RHO[KA - 1], aB = RHO[KA];
  for (let k = 0; k < K; k++) {
    const a = Math.max(k - 1, 0), b = Math.min(k + 1, K - 1);
    const ty = Y[b] - Y[a], tz = Z[b] - Z[a], len = Math.hypot(ty, tz), tot = k < KA ? aD : aB;
    RHO[k] = tot > 1e-12 ? RHO[k] / tot : 0;
    if (len < 1e-12 || k === 0 || k === K - 1) { NY[k] = 0; NZ[k] = 1; }
    else if (k < KA) { NY[k] = -tz / len; NZ[k] = ty / len; }
    else { NY[k] = tz / len; NZ[k] = -ty / len; }
  }
  if (aux) { aux.Y0.set(Y); aux.Z0.set(Z); aux.aD = aD; aux.aB = aB; }
  for (let k = 0; k < K; k++) {
    const D = ti * gridAt(k < KA ? rowD : rowB, RHO[k]);
    if (D === 0) continue;
    Y[k] = clip(Y[k] + D * NY[k], yi, hi);                // never wider than the outline, never across the stringer
    Z[k] += D * NZ[k];
  }
  return sh;
}

function sections(p, x, h, yin, t, zb, M, sl) {
  const n = x.length;
  const Yo = new Float64Array(n * M), Zo = new Float64Array(n * M);
  const Y = new Float64Array(K), Z = new Float64Array(K), cum = new Float64Array(K);
  const rowD = new Float64Array(GRID), rowB = new Float64Array(GRID), d = {};
  const pts = sl && sl.pts;
  for (let i = 0; i < n; i++) {
    const ti = t[i];
    if (sl) sliceBlend(sl, x[i], d, rowD, rowB);         // blend what the two neighbouring slices change
    sectionDense(p, x[i], h[i], yin[i], ti, zb[i], sl ? d : null, pts ? rowD : null, rowB, Y, Z, null);
    // resample by arc length plus turning angle so hard rails stay crisp
    cum[0] = 0;
    let prevRaw = 0, unwrapped = 0, prevAng = 0;
    for (let j = 0; j < K - 1; j++) {
      const dY = Y[j + 1] - Y[j], dZ = Z[j + 1] - Z[j];
      const raw = Math.atan2(dZ, dY);
      if (j === 0) unwrapped = raw;
      else {
        const d = raw - prevRaw;
        let dm = ((((d + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;
        if (dm === -Math.PI && d > 0) dm = Math.PI;
        unwrapped += Math.abs(d) < Math.PI ? d : dm;
      }
      const dturn = j === 0 ? 0 : Math.abs(unwrapped - prevAng);
      prevRaw = raw; prevAng = unwrapped;
      cum[j + 1] = cum[j] + Math.hypot(dY, dZ) + 0.35 * ti * dturn;
    }
    const total = cum[K - 1], base = i * M;
    if (total <= 1e-12) { Yo.fill(Y[0], base, base + M); Zo.fill(Z[0], base, base + M); continue; }
    let j = 0;
    for (let m = 0; m < M; m++) {
      const tgt = (total * m) / (M - 1);
      if (m === M - 1 || tgt >= total) { Yo[base + m] = Y[K - 1]; Zo[base + m] = Z[K - 1]; continue; }
      while (j < K - 2 && cum[j + 1] <= tgt) j++;
      const span = cum[j + 1] - cum[j], f = span > 0 ? (tgt - cum[j]) / span : 0;
      Yo[base + m] = Y[j] + f * (Y[j + 1] - Y[j]);
      Zo[base + m] = Z[j] + f * (Z[j + 1] - Z[j]);
    }
  }
  return [Yo, Zo];
}

/* ---------------------------------------------------------------------------
   Mesh
   --------------------------------------------------------------------------- */
function stationXs(p) {
  const n = p.stations, L = p.length, half = L / 2;
  const xs = [];
  for (let i = 0; i < n; i++) {
    const s = n === 1 ? 0 : i / (n - 1);
    xs.push(L * (0.55 * 0.5 * (1 - Math.cos(Math.PI * s)) + 0.45 * s));
  }
  xs.push(12, L - 12, half + p.wide_point_offset, half + p.rocker_low_point, half + p.thickness_point_offset);
  const tail = TAIL_TYPES[p.tail_type];
  if (tail.notch) for (let j = 1; j <= 8; j++) xs.push((p.swallow_depth * j) / 8);     // the cut can be curved
  if (tail.corner > 0) for (const f of [0.04, 0.15, 0.35, 0.6, 1]) xs.push(tail.corner * f);   // round the tail corners properly
  for (const s of p.slices) xs.push(s.x);
  for (const r of p.marks) xs.push(r.x);
  xs.sort((a, b) => a - b);
  const out = [xs[0]];
  for (let i = 1; i < xs.length; i++) if (xs[i] - xs[i - 1] > 1e-3) out.push(xs[i]);  // np.unique + gap filter
  return Float64Array.from(out);
}

function buildMesh(p, tScale) {
  const x = stationXs(p), n = x.length, M = p.section_points;
  // base curves, then the anchor-point corrections
  const h0 = halfWidth(p, x), zb0 = rocker(p, x), foil0 = foil(p, x);
  const arms = { outline: [], rocker: [], thickness: [], swallow: [] };
  const dh = curveDelta(p, 'outline', x, arms.outline), dz = curveDelta(p, 'rocker', x, arms.rocker), dt = curveDelta(p, 'thickness', x, arms.thickness);
  const h = Float64Array.from(h0, (v, i) => Math.max(v + dh[i], 0.15 * v));
  const zb = Float64Array.from(zb0, (v, i) => v + dz[i]);
  const t = Float64Array.from(foil0, (v, i) => {
    const ti = Math.max(v + dt[i], 0.15 * v) * tScale;
    return ti * Math.tanh((1.5 * h[i]) / Math.max(ti, 1e-9));   // pinch where the outline gets narrow
  });
  const notch = notchHalfWidth(p, x, arms.swallow);
  const yin = Float64Array.from(notch, (v, i) => Math.min(v, h[i] * 0.95));
  const sl = sliceTables(p);
  const [Y, Z] = sections(p, x, h, yin, t, zb, M, sl);

  let nv = 0;
  for (let i = 0; i < n; i++) nv += h[i] < 1e-6 ? 1 : yin[i] > 1e-9 ? 2 * M : 2 * M - 2;
  const capCount = (h[0] >= 1e-6 ? 2 : 0) + (h[n - 1] >= 1e-6 ? 2 : 0);
  const V = new Float64Array((nv + capCount) * 3);
  const IR = new Int32Array(n * M), IL = new Int32Array(n * M);
  let c = 0;
  const put = (a, b, z) => { V[3 * c] = a; V[3 * c + 1] = b; V[3 * c + 2] = z; return c++; };
  for (let i = 0; i < n; i++) {
    const o = i * M;
    if (h[i] < 1e-6) { const id = put(x[i], 0, zb[i]); IR.fill(id, o, o + M); IL.fill(id, o, o + M); continue; }
    for (let m = 0; m < M; m++) IR[o + m] = put(x[i], Y[o + m], Z[o + m]);
    if (yin[i] > 1e-9) for (let m = 0; m < M; m++) IL[o + m] = put(x[i], -Y[o + m], Z[o + m]);
    else {
      IL[o] = IR[o]; IL[o + M - 1] = IR[o + M - 1];
      for (let m = 1; m < M - 1; m++) IL[o + m] = put(x[i], -Y[o + m], Z[o + m]);
    }
  }

  const F = [];
  const tri = (a, b, d, flip) => (flip ? F.push(d, b, a) : F.push(a, b, d));
  for (const [I, flip] of [[IR, false], [IL, true]]) {
    for (let i = 0; i < n - 1; i++) for (let m = 0; m < M - 1; m++)
      tri(I[i * M + m], I[(i + 1) * M + m], I[(i + 1) * M + m + 1], flip);
    for (let i = 0; i < n - 1; i++) for (let m = 0; m < M - 1; m++)
      tri(I[i * M + m], I[(i + 1) * M + m + 1], I[i * M + m + 1], flip);
  }
  for (let i = 0; i < n - 1; i++) {                      // swallow notch walls
    if (!(yin[i] > 1e-9 && h[i] >= 1e-6)) continue;
    for (const [I, flip] of [[IR, false], [IL, true]]) {
      const q = [I[i * M], I[i * M + M - 1], I[(i + 1) * M + M - 1], I[(i + 1) * M]];
      tri(q[0], q[1], q[2], flip); tri(q[0], q[2], q[3], flip);
    }
  }
  const cap = (row, noseEnd) => {                        // fan from the section's centroid
    for (const [I, flip] of [[IR, false], [IL, true]]) {
      let sx = 0, sy = 0, sz = 0;
      for (let m = 0; m < M; m++) { const v = I[row * M + m]; sx += V[3 * v]; sy += V[3 * v + 1]; sz += V[3 * v + 2]; }
      const ci = put(sx / M, sy / M, sz / M);
      for (let m = 0; m < M; m++) {
        const a = I[row * M + m], b = I[row * M + ((m + 1) % M)];
        noseEnd ? tri(ci, b, a, flip) : tri(ci, a, b, flip);
      }
    }
  };
  if (h[0] >= 1e-6) cap(0, false);
  if (h[n - 1] >= 1e-6) cap(n - 1, true);

  const idx = [];
  for (let f = 0; f < F.length; f += 3) {
    const a = F[f], b = F[f + 1], d = F[f + 2];
    if (a !== b && b !== d && a !== d) idx.push(a, b, d);
  }
  const faces = Uint32Array.from(idx);
  let vol = meshVolume(V, faces);
  if (vol < 0) {
    for (let f = 0; f < faces.length; f += 3) { const tmp = faces[f]; faces[f] = faces[f + 2]; faces[f + 2] = tmp; }
    vol = -vol;
  }
  return { V, F: faces, vol, prof: { x, h, yin, zb, t, Y, Z, M, h0, zb0, foil0, sl, arms } };
}

function meshVolume(V, F) {
  let s = 0;
  for (let f = 0; f < F.length; f += 3) {
    const a = 3 * F[f], b = 3 * F[f + 1], c = 3 * F[f + 2];
    s += V[a] * (V[b + 1] * V[c + 2] - V[b + 2] * V[c + 1])
       + V[a + 1] * (V[b + 2] * V[c] - V[b] * V[c + 2])
       + V[a + 2] * (V[b] * V[c + 1] - V[b + 1] * V[c]);
  }
  return s / 6;
}

function meshArea(V, F) {
  let s = 0;
  for (let f = 0; f < F.length; f += 3) {
    const a = 3 * F[f], b = 3 * F[f + 1], c = 3 * F[f + 2];
    const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
    const vx = V[c] - V[a], vy = V[c + 1] - V[a + 1], vz = V[c + 2] - V[a + 2];
    s += Math.hypot(uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx);
  }
  return s / 2;
}

function interp(xq, xs, ys) {                           // np.interp
  const n = xs.length;
  if (xq <= xs[0]) return ys[0];
  if (xq >= xs[n - 1]) return ys[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] <= xq) lo = mid; else hi = mid; }
  return ys[lo] + ((xq - xs[lo]) / (xs[hi] - xs[lo])) * (ys[hi] - ys[lo]);
}

/* ---------------------------------------------------------------------------
   Board
   --------------------------------------------------------------------------- */
function buildBoard(input = {}) {
  const t0 = performance.now();
  const [p, warnings] = validated(paramsFromDict(input));
  let scale = 1;
  let mesh = buildMesh(p, scale);
  if (p.lock_volume) {
    const target = p.target_volume / IN3_TO_L;
    for (let it = 0; it < 6; it++) {
      scale = clip(scale * (target / mesh.vol), 0.4, 2.5);
      mesh = buildMesh(p, scale);
      if (Math.abs(mesh.vol - target) / target < 1e-4) break;
    }
    if (scale === 0.4 || scale === 2.5) warnings.push('target volume out of reach by scaling thickness alone');
  }
  const board = {
    params: p, warnings, thickness_scale: scale, auto: p._auto,
    vertices: mesh.V, faces: mesh.F, volume_l: mesh.vol * IN3_TO_L, _profiles: mesh.prof,
  };
  board.stats = stats(board);
  board.build_ms = Math.round((performance.now() - t0) * 10) / 10;
  return board;
}

function stationTable(board) {
  const p = board.params, { x, h, zb, t } = board._profiles, L = p.length;
  const tail = TAIL_TYPES[p.tail_type];
  const row = (label, xs, mark) => ({
    label, from_nose_in: L - xs,
    width_in: xs === 0 && !tail.closes ? p.tail_block_width : 2 * interp(xs, x, h),
    rocker_in: interp(xs, x, zb), thickness_in: interp(xs, x, t), mark,
  });
  return [
    ...[['Nose tip', L], ['12" from nose', L - 12], ['Wide point', L / 2 + p.wide_point_offset], ['12" from tail', 12], ['Tail end', 0]].map(([label, xs]) => row(label, xs, false)),
    ...p.marks.map((r) => row(`${fmtIn(r.pos)} from ${r.from}`, r.x, true)),      // added measurements, after the five standard ones
  ];
}

function stats(board) {
  const p = board.params, { x, h, yin, t } = board._profiles, L = p.length;
  let plan = 0, hmax = 0, tmax = 0;
  for (let i = 0; i < x.length; i++) {
    hmax = Math.max(hmax, h[i]); tmax = Math.max(tmax, t[i]);
    if (i) plan += ((x[i] - x[i - 1]) * (2 * h[i] - 2 * yin[i] + 2 * h[i - 1] - 2 * yin[i - 1])) / 2;
  }
  const rem = L % 12, remS = Number.isInteger(rem) ? `${rem}` : rem.toFixed(1);
  return {
    length_in: L,
    length_ftin: `${Math.floor(L / 12)}'${remS.endsWith('.0') ? remS.slice(0, -2) : remS}"`,
    width_in: 2 * hmax, thickness_in: tmax, volume_l: board.volume_l,
    nose_width_12_in: 2 * interp(L - 12, x, h), tail_width_12_in: 2 * interp(12, x, h),
    plan_area_in2: plan, surface_area_in2: meshArea(board.vertices, board.faces),
    thickness_scale: board.thickness_scale, stations: stationTable(board),
    vertices: board.vertices.length / 3, triangles: board.faces.length / 3,
  };
}

/** Curves for the 2D panels (same shape as the Python server's JSON). */
function curves(board) {
  const { x, h, yin, zb, t, Y, Z, M } = board._profiles, L = board.params.length;
  const A = (a) => Array.from(a);
  const sx = [], sd = [], sb = [];
  for (let i = 0; i < x.length; i++) if (yin[i] <= 1e-9) { sx.push(x[i]); sd.push(Z[i * M]); sb.push(Z[i * M + M - 1]); }
  const out = {
    outline: { x: A(x), h: A(h), yin: A(yin) },
    rocker: { x: A(x), bottom: A(zb), deck: A(zb).map((v, i) => v + t[i]) },
    stringer: { x: sx, deck: sd, bottom: sb },
    sections: {},
  };
  for (const [name, xs] of [['tail_12', 12], ['center', L / 2], ['nose_12', L - 12]]) {
    let best = 0;
    for (let i = 1; i < x.length; i++) if (Math.abs(x[i] - xs) < Math.abs(x[best] - xs)) best = i;
    const Yr = Y.slice(best * M, best * M + M), Zr = Z.slice(best * M, best * M + M);
    out.sections[name] = {
      x: x[best],
      y: [...Yr, ...Array.from(Yr).reverse().map((v) => -v)],
      z: [...Zr, ...Array.from(Zr).reverse()].map((v) => v - zb[best]),
    };
  }
  return out;
}

/**
 * The cross section at any position x, as two lines from the stringer to the rail apex
 * (deck and bottom), heights measured from the flat bottom line. Each line has its points
 * (y, z), the same before any slice anchor points (y0, z0), the arc-length position rho of
 * every point and the normal (ny, nz) anchor points move along. Used to roll through the
 * board section by section, and by the section editor.
 */
function sectionAt(board, x) {
  const p = board.params, pr = board._profiles;
  const h = interp(x, pr.x, pr.h), t = interp(x, pr.x, pr.t), yin = interp(x, pr.x, pr.yin);
  const d = {}, rowD = new Float64Array(GRID), rowB = new Float64Array(GRID);
  if (pr.sl) sliceBlend(pr.sl, x, d, rowD, rowB);
  const Y = new Float64Array(K), Z = new Float64Array(K);
  const aux = { Y0: new Float64Array(K), Z0: new Float64Array(K), rho: new Float64Array(K), ny: new Float64Array(K), nz: new Float64Array(K) };
  const pts = pr.sl && pr.sl.pts;
  const sh = sectionDense(p, x, h, yin, t, 0, pr.sl ? d : null, pts ? rowD : ZERO_ROW, pts ? rowB : ZERO_ROW, Y, Z, aux);
  const line = (a, b, back) => {
    const cut = (arr) => { const v = Array.from(arr.subarray(a, b)); return back ? v.reverse() : v; };
    return { y: cut(Y), z: cut(Z), y0: cut(aux.Y0), z0: cut(aux.Z0), rho: cut(aux.rho), ny: cut(aux.ny), nz: cut(aux.nz) };
  };
  return { x, h, t, yin, apex_in: sh.ar * t, shape: sh, deck: line(0, KA, false), bottom: line(KA, K, true), girth: { deck: aux.aD, bottom: aux.aB } };
}

/** One user slice: its section plus what the editor needs (settings, handles in use). */
function sliceInfo(board, k) {
  const p = board.params, pr = board._profiles, s = p.slices[k];
  const arms = (which) => (pr.sl && pr.sl.pts ? pr.sl[which][k + 1].arms : []);
  return { ...sectionAt(board, s.x), id: s.id, adj: s.adj, base: sectionBase(p, s.x), arms: { deck: arms('deck'), bottom: arms('bottom') } };
}

function specSheet(board) {
  const s = board.stats, p = board.params;
  const name = (v) => v.replace(/_/g, ' ');
  const L = (str, n) => str.padEnd(n), R = (str, n) => str.padStart(n);
  const lines = [
    `${fmtFtin(s.length_in)} x ${fmtIn(s.width_in)} x ${fmtIn(s.thickness_in)}   ${s.volume_l.toFixed(1)} L`,
    `nose: ${name(p.nose_type)}    tail: ${name(p.tail_type)}`,
    '',
    `${L('Station', 20)}${R('From nose', 11)}${R('Width', 10)}${R('Rocker', 10)}${R('Thickness', 11)}`,
    ...[...s.stations].sort((a, b) => a.from_nose_in - b.from_nose_in).map((r) => `${L(r.label, 20)}${R(fmtFtin(r.from_nose_in), 11)}${R(fmtIn(r.width_in), 10)}${R(fmtIn(r.rocker_in), 10)}${R(fmtIn(r.thickness_in), 11)}`),
    '',
    `wide point   ${fmtIn(p.wide_point_offset)} from center (+ = toward nose)`,
    `rocker low   ${fmtIn(p.rocker_low_point)} from center`,
    `thick point  ${fmtIn(p.thickness_point_offset)} from center`,
    `rails        apex ${p.rail_apex_in !== null ? `${fmtIn(p.rail_apex_in)} above the bottom` : `${Math.round(p.rail_apex * 100)}% of thickness`}, fullness ${p.rail_fullness.toFixed(2)}, deck dome ${p.deck_dome.toFixed(2)}`,
    ...(p.bottom.length
      ? ['bottom       contours, nose to tail:', ...[...p.bottom].reverse().map((r) =>
        `             ${fmtIn(r.pos)} from ${r.from}: ${BOTTOM_LABELS[r.type]}${r.type === 'flat' ? '' : ` ${fmtIn(r.depth)}`}${r.type.endsWith('_double') ? ` / ${fmtIn(r.depth2)}` : ''}`)]
      : [`bottom       concave ${fmtIn(p.concave_depth)}, tail vee ${fmtIn(p.vee_depth)}`]),
    `plan area    ${s.plan_area_in2.toFixed(0)} sq in`,
    '',
    'Inches to the nearest 1/16. Rocker is bottom height above a flat table touching the low point.',
  ];
  return lines.join('\n') + '\n';
}

/* ---------------------------------------------------------------------------
   Exports
   --------------------------------------------------------------------------- */
function toSTL(board, units = 'mm') {
  const s = units === 'mm' ? 25.4 : 1, V = board.vertices, F = board.faces, nt = F.length / 3;
  const buf = new ArrayBuffer(84 + 50 * nt), dv = new DataView(buf);
  const header = `surfboard ${board.params.length.toFixed(1)}in ${board.volume_l.toFixed(2)}L units=${units}`.padEnd(80).slice(0, 80);
  for (let i = 0; i < 80; i++) dv.setUint8(i, header.charCodeAt(i));
  dv.setUint32(80, nt, true);
  let o = 84;
  for (let f = 0; f < F.length; f += 3) {
    const a = 3 * F[f], b = 3 * F[f + 1], c = 3 * F[f + 2];
    const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
    const vx = V[c] - V[a], vy = V[c + 1] - V[a + 1], vz = V[c + 2] - V[a + 2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const ln = Math.max(Math.hypot(nx, ny, nz), 1e-12); nx /= ln; ny /= ln; nz /= ln;
    for (const v of [nx, ny, nz]) { dv.setFloat32(o, v, true); o += 4; }
    for (const k of [a, b, c]) for (let d = 0; d < 3; d++) { dv.setFloat32(o, V[k + d] * s, true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  return new Uint8Array(buf);
}

function toOBJ(board, units = 'mm') {
  const s = units === 'mm' ? 25.4 : 1, V = board.vertices, F = board.faces;
  const lines = [`# surfboard, units=${units}, volume=${board.volume_l.toFixed(2)} L`];
  for (let i = 0; i < V.length; i += 3) lines.push(`v ${(V[i] * s).toFixed(5)} ${(V[i + 1] * s).toFixed(5)} ${(V[i + 2] * s).toFixed(5)}`);
  for (let f = 0; f < F.length; f += 3) lines.push(`f ${F[f] + 1} ${F[f + 1] + 1} ${F[f + 2] + 1}`);
  return lines.join('\n') + '\n';
}

/** Minimal store-only .zip (some hosts only allow saving .zip, not .stl). */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function zipOne(name, data) {
  let crc = 0xffffffff;
  for (let i = 0; i < data.length; i++) crc = CRC[(crc ^ data[i]) & 0xff] ^ (crc >>> 8);
  crc = (crc ^ 0xffffffff) >>> 0;
  const nb = new TextEncoder().encode(name), size = data.length;
  const out = new Uint8Array(30 + nb.length + size + 46 + nb.length + 22), dv = new DataView(out.buffer);
  let o = 0;
  const u32 = (v) => { dv.setUint32(o, v, true); o += 4; }, u16 = (v) => { dv.setUint16(o, v, true); o += 2; };
  u32(0x04034b50); u16(20); u16(0); u16(0); u16(0); u16(0x21); u32(crc); u32(size); u32(size); u16(nb.length); u16(0);
